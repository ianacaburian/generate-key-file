name: build

on:
    workflow_dispatch:
    pull_request:
        branches: ['master']

env:
    HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
    build_and_test:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macOS
                      os: macos-26

        steps:
            - name: Installing OSX utils
              if: ${{ matrix.name == 'macOS' }}
              run: brew install osxutils

            - name: Checking out code
              uses: actions/checkout@v5
              with:
                  submodules: true

            - name: Set up Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint, install tests, and build package
              run: npm run build

            - name: Perform test run
              run: FC_NUM_RUNS=10 npm run test run
